<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语音识别助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="logo">🎙</span>
      <div class="brand-text">
        <h1>语音识别助手</h1>
        <p>页面 audio 一键提交识别</p>
      </div>
    </div>
    <label class="switch master" title="启用 / 停用插件">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <section class="card status-card">
    <div class="status-line">
      <span id="page-stat" class="page-stat">正在检测当前页面…</span>
      <button id="rescan" type="button" class="ghost">重新检测</button>
    </div>
    <p id="page-hint" class="page-hint"></p>
  </section>

  <section class="card">
    <h2>接口设置</h2>

    <div class="field">
      <label for="endpoint">接口地址</label>
      <input id="endpoint" type="url" placeholder="http://localhost:8000/api/asr" spellcheck="false" autocomplete="off">
    </div>

    <div class="field">
      <label for="field-name">文件字段名</label>
      <input id="field-name" type="text" value="file" placeholder="file" spellcheck="false" autocomplete="off">
    </div>

    <div class="request-preview">
      <div class="preview-title">点击按钮时发送的请求</div>
      <pre id="request-preview">POST &lt;接口地址&gt;
Content-Type: multipart/form-data
file=&lt;音频文件&gt;</pre>
    </div>

    <p class="tip">
      按钮会出现在每个 audio 播放器下方。点击后插件取播放源文件，以 <code>file</code> 字段 POST 到上面的地址，
      接口返回的文本会追加显示在播放器下方。请求由插件后台发出，不受页面跨域限制。
    </p>
  </section>

  <p class="foot">
    接口地址与字段名只保存在本机（chrome.storage.local），不会同步到其他设备。
  </p>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="popup.js"></script>
</body>
</html>
